name: Fetch World Cup Results

on:
  schedule:
    # Match windows run ~9 AM-7 PM PT during the tournament (Jun 11 - Jul 19).
    # 10 syncs/day. Cron is UTC; labels are Pacific (PDT = UTC-7):
    - cron: '0 14 * * *'   # 7 AM PT — morning catch-up
    - cron: '0 16 * * *'   # 9 AM PT
    - cron: '0 18 * * *'   # 11 AM PT
    - cron: '0 19 * * *'   # 12 PM PT
    - cron: '0 20 * * *'   # 1 PM PT
    - cron: '0 21 * * *'   # 2 PM PT
    - cron: '0 22 * * *'   # 3 PM PT
    - cron: '0 0 * * *'    # 5 PM PT
    - cron: '0 2 * * *'    # 7 PM PT
    - cron: '0 4 * * *'    # 9 PM PT — end-of-day sweep
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch results
        run: python fetch_results.py

      - name: Commit results.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json
          git diff --staged --quiet || git commit -m "chore: update WC results $(date -u +%Y-%m-%d)"
          git push
