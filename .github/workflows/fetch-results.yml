name: Fetch World Cup Results

on:
  schedule:
    # Match windows run ~12 PM-10 PM ET during the tournament (Jun 11 - Jul 19).
    # Sync after each window + a morning catch-up. Times in UTC:
    - cron: '0 14 * * *'   # 10 AM ET — morning catch-up
    - cron: '0 19 * * *'   # 3 PM ET — after early matches
    - cron: '0 22 * * *'   # 6 PM ET — after afternoon matches
    - cron: '0 1 * * *'    # 9 PM ET — after evening matches
    - cron: '0 3 * * *'    # 11 PM ET — end-of-day sweep
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch results
        run: python fetch_results.py

      - name: Commit results.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json
          git diff --staged --quiet || git commit -m "chore: update WC results $(date -u +%Y-%m-%d)"
          git push
